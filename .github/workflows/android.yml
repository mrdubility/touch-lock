name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# contents: write 仅用于 tag 触发时自动创建 Release；普通 push / PR 构建本身不需要写权限
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble APK (main 与 tag 都产出正式签名 release，仅 tag 对外发布)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AGP 8.5.2 需要 compileSdk 34 / Build-Tools 34.0.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 本仓库未提交 gradle-wrapper.jar，因此不使用 ./gradlew，
      # 改为安装 gradle-wrapper.properties 声明的同一版本，保持单一事实来源。
      - name: Resolve Gradle version
        id: gradle-version
        run: |
          set -euo pipefail
          v=$(sed -nE 's|^distributionUrl=.*gradle-(.+)-[a-z]+\.zip.*$|\1|p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$v" || { echo '无法从 gradle-wrapper.properties 解析 Gradle 版本' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "使用 Gradle $v"

      - name: Install Gradle
        env:
          GRADLE_VERSION: ${{ steps.gradle-version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      # ============ 从这里开始是签名链路 ============
      # 除下面的 Assemble release APK 外，各步骤的条件都是：
      #   github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      # main 也跑一遍正式签名，是为了得到一个“能直接覆盖安装、但不会发布出去”的自测包：
      # 本地编的 debug 包用的是默认 debug keystore，与 release 包签名不同，装之前必须先卸载、
      # 还会丢掉已存设置；用同一把正式密钥签的包就没这个麻烦。
      # 所以 CI 不再另外编一份 debug 产物（曾经有，已删）：源码与 release 完全相同、两边都不开
      # 混淆，多编一份只是白等一遍编译、多一个没人用的包；PR 上的编译校验则由下面那次 assembleRelease 担。
      # 上述条件对 pull_request 自动不成立（其 github.ref 是 refs/pull/N/merge），所以来自 fork 的
      # PR（本就拿不到 Secrets）不会因为签名这几步而失败，它只会跑到下面那次编译为止。
      # 签名密钥不入库：由 GitHub Secrets 提供，临时还原到 runner 上，用完随虚拟机一起销毁

      - name: Restore release keystore from secrets
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "缺少 GitHub Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD" >&2
            echo "请到 仓库 Settings > Secrets and variables > Actions 添加后重跑本 workflow" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/touch-lock-release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/touch-lock-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "keystore 已还原：$(wc -c < "$RUNNER_TEMP/keystore/touch-lock-release.jks") bytes"

      # 全仓库唯一一次编译，所有事件都跑（含 pull_request）：删掉 debug 后它就是 PR 上仅有的编译校验。
      # PR 拿不到 Secrets，此时 build.gradle.kts 只打一行提示并产出未签名 APK（只有显式给了
      # KEYSTORE_FILE 却读不到材料才抛异常）；未签名的包不上传也不验签，所以不会误伤来自 fork 的 PR。
      - name: Assemble release APK
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease --stacktrace --console=plain 2>&1 | tee /tmp/gradle-release.log

      # 硬验签：万一签名链路静默失效（产出未签名 APK），在此处直接失败而不是发到 Release 上
      - name: Verify release APK signature
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          signer="$(for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/.android/sdk" /usr/local/lib/android/sdk; do
            { [ -n "$d" ] && [ -d "$d" ]; } || continue
            find "$d" -maxdepth 3 -type f -name apksigner 2>/dev/null || true
          done | sort -V | tail -1)"
          if [ -z "$signer" ]; then
            echo "找不到 apksigner，无法确认 APK 已签名" >&2
            exit 1
          fi
          sh "$signer" verify --print-certs -v "$apk" | tee /tmp/apksigner-verify.txt
          # 不只要“有签名”，还要是 RELEASE_CERT_SHA256.txt 登记的那把钥匙。
          # 否则一旦密钥被换掉，老用户覆盖安装又会报签名冲突（和当初 debug keystore 同一个坑）。
          want="$(tr -d ' \t\n\r:' < RELEASE_CERT_SHA256.txt | tr 'A-Z' 'a-z')"
          got="$(grep 'certificate SHA-256 digest' /tmp/apksigner-verify.txt | head -1 | awk '{print $NF}')"
          echo "expected cert sha256 = $want"
          echo "actual   cert sha256 = $got"
          if [ -z "$got" ]; then
            echo "没能从 apksigner 输出里读到 SHA-256 指纹，请确认其输出格式" >&2
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "签名证书与登记指纹不一致：本次 APK 不是用正式 release key 签的，拒绝发布" >&2
            exit 1
          fi
          echo "证书指纹匹配，确认本次产物由正式 release key 签名"

      # main 与 tag 共用同一个产物名：具体是哪个版本看运行页上的 ref 与提交即可
      - name: Upload release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: touch-lock-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # 只有 tag 才对外发布：main 上得到的签名包只停在 Actions Artifacts（需登录才能下载）
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          apk="touch-lock-${tag}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "正式签名（自管 release key）的 release APK，可直接安装，后续版本覆盖升级无需卸载。"
            echo ""
            echo "- 开始锁定：点桌面图标，或点下拉栏「触摸锁」磁贴（下拉通知栏 > 编辑 > 把磁贴拖进快捷开关区）"
            echo "- 顶部倒计时卡片默认 5 秒，设置里可调 0–30 秒（0 = 立即锁定），期间可自由切换到要保护的应用"
            echo "- 解锁：把屏幕四分之三高度处的滑块向右拖到底；点通知栏那条通知可直接解锁（不再另设重复按钮）"
            echo "- 倒计时阶段：点卡片齿轮进设置会先取消本次锁定；点通知即取消"
            echo "- 暗屏下看不清滑块时，按住屏幕任意位置（含滑块上）约 0.2 秒即临时点亮，开始拖动也会点亮，松手恢复暗屏"
            echo "- 已授权后点图标不再进设置页：长按桌面图标 >「设置」，或点倒计时卡片上的齿轮"
            echo "- 若之前装过 debug 版：两者签名不同，需先卸载一次再装本包"
            echo ""
            echo "签名证书指纹（apksigner verify --print-certs，与仓库 RELEASE_CERT_SHA256.txt 一致）："
            echo ""
            echo '```'
            grep -E 'certificate (DN|SHA-256 digest)' /tmp/apksigner-verify.txt || true
            echo '```'
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖上传产物"
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "触摸锁 ${tag}" --notes-file notes.md
          fi

      # 构建失败时把日志尾部原文发成 commit comment：公开仓库的 comment 可免鉴权读取，
      # 而 Actions 日志接口需要 token，没有这一步就只能盲猜编译错误。
      # 注意：Actions 的 Linux 默认 shell 自带 -e，必须显式 set +e；
      # 且不按模式 grep（漏配就什么都发不出），直接取日志尾部，FAILURE 段一定在里面。
      - name: Report failure as commit comment
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          log=/tmp/gradle-release.log
          # 现在只剩 release 这一份 gradle 日志；挂得比 gradle 还早（装 SDK 等步骤）就补一行说明，
          # 免得摘要评论里什么都没有，只能回到 Actions 页面盲查
          if [ ! -s "$log" ]; then echo 'failed before gradle produced any log' > "$log"; fi
          {
            echo "### CI failure digest"
            echo "run=${GITHUB_RUN_ID} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
            echo "log=${log}"
            echo '```'
            echo '--- error lines ---'
            grep -nE '^(e: |error:)|Caused by:|What went wrong|Execution failed for task|A problem occurred|BUILD FAILED|FAILURE:' "$log" | head -40
            echo '--- what went wrong ---'
            grep -n -A 12 'What went wrong' "$log" | head -40
            echo '--- kotlin error context ---'
            grep -n -A 4 '^e: ' "$log" | head -60
            echo '--- tail ---'
            tail -c 1200 "$log"
            echo ''
            echo '```'
          } > /tmp/report.md
          python3 -c "import io,json,sys; print(json.dumps({'body': io.open(sys.argv[1], encoding='utf-8', errors='replace').read()[:6000]}))" /tmp/report.md > /tmp/payload.json
          curl -sS -o /tmp/resp.json -w 'comment http=%{http_code}\n' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --data-binary @/tmp/payload.json
          cat /tmp/resp.json
