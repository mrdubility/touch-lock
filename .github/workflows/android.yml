name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# contents: write 仅用于 tag 触发时自动创建 Release；普通 push / PR 构建本身不需要写权限
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AGP 8.5.2 需要 compileSdk 34 / Build-Tools 34.0.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 本仓库未提交 gradle-wrapper.jar，因此不使用 ./gradlew，
      # 改为安装 gradle-wrapper.properties 声明的同一版本，保持单一事实来源。
      - name: Resolve Gradle version
        id: gradle-version
        run: |
          set -euo pipefail
          v=$(sed -nE 's|^distributionUrl=.*gradle-(.+)-[a-z]+\.zip.*$|\1|p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$v" || { echo '无法从 gradle-wrapper.properties 解析 Gradle 版本' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "使用 Gradle $v"

      - name: Install Gradle
        env:
          GRADLE_VERSION: ${{ steps.gradle-version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: touch-lock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 仅当本次运行由 v* 标签推送触发时，把 APK 发布成 GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          apk="touch-lock-${tag}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖上传产物"
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "触摸锁 ${tag}" \
              --notes "debug 签名，可直接安装。授予悬浮窗权限后点锁定屏幕，双击中央按钮解锁。"
          fi
