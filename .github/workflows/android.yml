name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# contents: write 仅用于 tag 触发时自动创建 Release；普通 push / PR 构建本身不需要写权限
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble APK (tags 额外产出正式签名 release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # AGP 8.5.2 需要 compileSdk 34 / Build-Tools 34.0.0
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 本仓库未提交 gradle-wrapper.jar，因此不使用 ./gradlew，
      # 改为安装 gradle-wrapper.properties 声明的同一版本，保持单一事实来源。
      - name: Resolve Gradle version
        id: gradle-version
        run: |
          set -euo pipefail
          v=$(sed -nE 's|^distributionUrl=.*gradle-(.+)-[a-z]+\.zip.*$|\1|p' gradle/wrapper/gradle-wrapper.properties)
          test -n "$v" || { echo '无法从 gradle-wrapper.properties 解析 Gradle 版本' >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "使用 Gradle $v"

      - name: Install Gradle
        env:
          GRADLE_VERSION: ${{ steps.gradle-version.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          echo "$HOME/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Show toolchain
        run: |
          java -version
          gradle --version

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: touch-lock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ================= 以下仅在 v* 标签推送时执行 =================
      # 签名密钥不入库：由 GitHub Secrets 提供，临时还原到 runner 上，用完随虚拟机一起销毁

      - name: Restore release keystore from secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "缺少 GitHub Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD" >&2
            echo "请到 仓库 Settings > Secrets and variables > Actions 添加后重跑本 workflow" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/touch-lock-release.jks"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/touch-lock-release.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "keystore 已还原：$(wc -c < "$RUNNER_TEMP/keystore/touch-lock-release.jks") bytes"

      - name: Assemble signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle --no-daemon assembleRelease --stacktrace

      # 硬验签：万一签名链路静默失效（产出未签名 APK），在此处直接失败而不是发到 Release 上
      - name: Verify release APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          signer="$(for d in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "$HOME/.android/sdk" /usr/local/lib/android/sdk; do
            { [ -n "$d" ] && [ -d "$d" ]; } || continue
            find "$d" -maxdepth 3 -type f -name apksigner 2>/dev/null || true
          done | sort -V | tail -1)"
          if [ -z "$signer" ]; then
            echo "找不到 apksigner，无法确认 APK 已签名" >&2
            exit 1
          fi
          sh "$signer" verify --print-certs -v "$apk"

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: touch-lock-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # 仅当本次运行由 v* 标签推送触发时，把正式签名 APK 发布成 GitHub Release
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          apk="touch-lock-${tag}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "正式签名（自管 release key）的 release APK，可直接安装，后续版本覆盖升级无需卸载。"
            echo ""
            echo "- 点桌面图标 -> 顶部倒计时卡片（默认 5 秒，设置里可调 0–60 秒）-> 全屏锁定"
            echo "- 解锁：按住屏幕中央滑块向右拖到底；通知栏“解锁”为备用出口"
            echo "- 长按桌面图标可直接进入设置页"
            echo "- 若之前装过 debug 版：两者签名不同，需先卸载一次再装本包"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖上传产物"
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "触摸锁 ${tag}" --notes-file notes.md
          fi
